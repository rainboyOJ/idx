<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="图生成 mini">
  <title>图生成 mini</title>
  <!-- 与站点同色（#2563eb）：一个父节点带两个子节点 -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="32" y1="19" x2="17" y2="43"/>
    <line x1="32" y1="19" x2="47" y2="43"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="19" r="9"/>
    <circle cx="17" cy="45" r="7"/>
    <circle cx="47" cy="45" r="7"/>
  </g>
</svg>
